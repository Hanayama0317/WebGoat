name: "DevSecOps Pipeline"

on:
  push:
    branches: ["develop", "master", "release/*"]
    paths-ignore:
      - "*.md"
      - "*.MD"
      - "*.txt"
      - "LICENSE"
      - "docs/**"
  pull_request:
    branches: ["develop"]
    paths-ignore:
      - "*.md"
      - "*.MD"
      - "*.txt"
      - "LICENSE"
      - "docs/**"
  schedule:
    # 毎週月曜 AM 3:00 (UTC) に定期スキャン
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ============================================================
  # 1. SAST: 静的アプリケーションセキュリティテスト
  # ============================================================

  sast-codeql:
    name: "SAST / CodeQL"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ["java", "javascript"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 15
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "15"
          architecture: x64

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # security-extended クエリでより広範な脆弱性を検出
          queries: security-extended,security-and-quality

      - name: Build (Java only)
        if: matrix.language == 'java'
        run: mvn package -DskipTests -B

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"
          upload: true
          # SARIF ファイルをローカルにも保存
          output: codeql-${{ matrix.language }}.sarif

      - name: Upload CodeQL SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codeql-sarif-${{ matrix.language }}
          path: codeql-${{ matrix.language }}.sarif
          retention-days: 30

  sast-semgrep:
    name: "SAST / Semgrep"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: semgrep/semgrep
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Semgrep (Java security rules)
        run: |
          semgrep ci \
            --config "p/java" \
            --config "p/owasp-top-ten" \
            --config "p/spring-security" \
            --sarif \
            --output semgrep-results.sarif \
            || true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep

      - name: Upload Semgrep results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: semgrep-results
          path: semgrep-results.sarif
          retention-days: 30

  sast-spotbugs:
    name: "SAST / SpotBugs (Find Security Bugs)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 15
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "15"
          architecture: x64

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Run SpotBugs with Find Security Bugs
        # spotbugs-maven-plugin + findsecbugs-plugin を使用
        run: |
          mvn compile spotbugs:spotbugs \
            -Dspotbugs.plugins=com.h3xstream.findsecbugs:findsecbugs-plugin:LATEST \
            -Dspotbugs.effort=Max \
            -Dspotbugs.threshold=Low \
            -Dspotbugs.xmlOutput=true \
            -Dspotbugs.xmlOutputDirectory=target/spotbugs \
            -DskipTests -B \
            || true

      - name: Convert SpotBugs XML to SARIF
        if: always()
        run: |
          python3 .github/scripts/spotbugs-to-sarif.py . spotbugs-results.sarif

      - name: Upload SpotBugs SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: spotbugs-results.sarif
          category: spotbugs

      - name: Upload SpotBugs SARIF artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-sarif
          path: spotbugs-results.sarif
          retention-days: 30

      - name: Upload SpotBugs XML artifact (詳細ログ用)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spotbugs-xml
          path: "**/target/spotbugs/*.xml"
          retention-days: 30

  # ============================================================
  # 2. Dependency Scan: 依存ライブラリの脆弱性スキャン
  # ============================================================

  dependency-owasp:
    name: "Dependency / OWASP Dependency-Check"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 15
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "15"
          architecture: x64

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Cache OWASP NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: ${{ runner.os }}-owasp-nvd-${{ github.run_id }}
          restore-keys: ${{ runner.os }}-owasp-nvd-

      - name: Run OWASP Dependency-Check
        run: |
          mvn org.owasp:dependency-check-maven:check \
            -DfailBuildOnCVSS=7 \
            -DsuppressionFile=.github/owasp-suppressions.xml \
            -Dformat=ALL \
            -DnvdApiKey=${{ secrets.NVD_API_KEY }} \
            -B \
            || true

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-dependency-check-report
          path: "**/target/dependency-check-report.*"
          retention-days: 30

      - name: Publish OWASP results to GitHub Security (SARIF)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: target/dependency-check-report.sarif
          category: owasp-dependency-check
        continue-on-error: true

  dependency-trivy-fs:
    name: "Dependency / Trivy Filesystem Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs-results.sarif"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: Upload Trivy fs SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs-results.sarif
          category: trivy-filesystem

      - name: Upload Trivy fs results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-filesystem-results
          path: trivy-fs-results.sarif
          retention-days: 30

  # ============================================================
  # 3. Secret Scan: シークレット・認証情報の漏洩検出
  # ============================================================

  secret-gitleaks:
    name: "Secret / Gitleaks"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history for git log scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Upload Gitleaks results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gitleaks-results
          path: results.sarif
          retention-days: 30

      - name: Upload Gitleaks SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results.sarif
          category: gitleaks
        continue-on-error: true

  secret-trufflehog:
    name: "Secret / TruffleHog"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: >
            --debug
            --only-verified
            --json

      - name: Upload TruffleHog results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trufflehog-results
          path: trufflehog-results.json
          retention-days: 30
        continue-on-error: true

  # ============================================================
  # 4. Container Scan: コンテナイメージの脆弱性スキャン
  # ============================================================

  container-build-and-scan:
    name: "Container / Build & Trivy Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: []  # 独立して実行（早期フィードバック）
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 15
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "15"
          architecture: x64

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build JAR
        run: mvn package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build WebGoat Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: webgoat-server/Dockerfile
          push: false
          tags: webgoat/webgoat:${{ github.sha }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy container scan (WebGoat)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "webgoat/webgoat:${{ github.sha }}"
          format: "sarif"
          output: "trivy-webgoat-image.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          vuln-type: "os,library"

      - name: Upload Trivy container SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-webgoat-image.sarif
          category: trivy-container-webgoat

      - name: Run Trivy container scan (Table format / CI log)
        uses: aquasecurity/trivy-action@master
        if: always()
        with:
          image-ref: "webgoat/webgoat:${{ github.sha }}"
          format: "table"
          severity: "CRITICAL,HIGH,MEDIUM"
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy container results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-container-webgoat
          path: trivy-webgoat-image.sarif
          retention-days: 30

  container-grype-scan:
    name: "Container / Grype Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 15
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "15"
          architecture: x64

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build JAR
        run: mvn package -DskipTests -B

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for Grype
        uses: docker/build-push-action@v5
        with:
          context: .
          file: webgoat-server/Dockerfile
          push: false
          tags: webgoat/webgoat:grype-scan
          load: true

      - name: Run Grype container scan
        uses: anchore/scan-action@v3
        id: grype-scan
        with:
          image: "webgoat/webgoat:grype-scan"
          fail-build: false
          severity-cutoff: high
          output-format: sarif

      - name: Upload Grype SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: ${{ steps.grype-scan.outputs.sarif }}
          category: grype-container

      - name: Upload Grype results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grype-container-results
          path: ${{ steps.grype-scan.outputs.sarif }}
          retention-days: 30

  container-dockerfile-lint:
    name: "Container / Dockerfile Lint (Hadolint)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Hadolint (webgoat-server)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: webgoat-server/Dockerfile
          format: sarif
          output-file: hadolint-webgoat.sarif
          no-fail: true

      - name: Upload Hadolint SARIF (webgoat-server)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-webgoat.sarif
          category: hadolint-webgoat

      - name: Run Hadolint (webwolf)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: webwolf/Dockerfile
          format: sarif
          output-file: hadolint-webwolf.sarif
          no-fail: true

      - name: Upload Hadolint SARIF (webwolf)
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: hadolint-webwolf.sarif
          category: hadolint-webwolf

      - name: Upload Hadolint results artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hadolint-results
          path: "hadolint-*.sarif"
          retention-days: 30

  # ============================================================
  # 5. パイプライン集計ジョブ
  # ============================================================

  security-gate:
    name: "Security Gate"
    runs-on: ubuntu-latest
    needs:
      - sast-codeql
      - sast-semgrep
      - sast-spotbugs
      - dependency-owasp
      - dependency-trivy-fs
      - secret-gitleaks
      - secret-trufflehog
      - container-build-and-scan
      - container-grype-scan
      - container-dockerfile-lint
    if: always()
    steps:
      - name: Check all security scan results
        run: |
          echo "=============================="
          echo " DevSecOps Pipeline Results"
          echo "=============================="
          echo "SAST / CodeQL:              ${{ needs.sast-codeql.result }}"
          echo "SAST / Semgrep:             ${{ needs.sast-semgrep.result }}"
          echo "SAST / SpotBugs:            ${{ needs.sast-spotbugs.result }}"
          echo "Dependency / OWASP:         ${{ needs.dependency-owasp.result }}"
          echo "Dependency / Trivy FS:      ${{ needs.dependency-trivy-fs.result }}"
          echo "Secret / Gitleaks:          ${{ needs.secret-gitleaks.result }}"
          echo "Secret / TruffleHog:        ${{ needs.secret-trufflehog.result }}"
          echo "Container / Trivy Image:    ${{ needs.container-build-and-scan.result }}"
          echo "Container / Grype:          ${{ needs.container-grype-scan.result }}"
          echo "Container / Hadolint:       ${{ needs.container-dockerfile-lint.result }}"
          echo "=============================="

      - name: "Gate: Fail if critical secrets detected"
        if: >
          needs.secret-gitleaks.result == 'failure' ||
          needs.secret-trufflehog.result == 'failure'
        run: |
          echo "::error::シークレットスキャンで問題が検出されました。マージをブロックします。"
          exit 1

      - name: Summary
        run: |
          echo "### DevSecOps Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "| スキャン種別 | ジョブ名 | 結果 |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | CodeQL | ${{ needs.sast-codeql.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | Semgrep | ${{ needs.sast-semgrep.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| SAST | SpotBugs | ${{ needs.sast-spotbugs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency | OWASP Dependency-Check | ${{ needs.dependency-owasp.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency | Trivy Filesystem | ${{ needs.dependency-trivy-fs.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | Gitleaks | ${{ needs.secret-gitleaks.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret | TruffleHog | ${{ needs.secret-trufflehog.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container | Trivy Image | ${{ needs.container-build-and-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container | Grype | ${{ needs.container-grype-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Container | Hadolint | ${{ needs.container-dockerfile-lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "全スキャン結果は GitHub Security タブで確認してください。" >> $GITHUB_STEP_SUMMARY
